# Demo workloads for the claims-reconciliation story.
# All three run in namespace "healthcare" on the same node.
#
# claims-reconciliation deliberately has NO memory limit and leaks memory up to
# LEAK_CAP_MB, then logs a blocked worker - the "hung process". The cap keeps
# a laptop safe; the alert payloads carry the production-scale numbers.
apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claims-reconciliation-app
  namespace: healthcare
data:
  app.py: |
    import os, time
    cap = int(os.environ.get("LEAK_CAP_MB", "300"))
    step = int(os.environ.get("LEAK_STEP_MB", "5"))
    interval = int(os.environ.get("LEAK_INTERVAL_S", "10"))
    held = []
    print("claims-reconciliation v2.14.0 starting (x12-claims-parser 5.0.0)", flush=True)
    while True:
        if len(held) * step < cap:
            held.append(b"x" * (step << 20))   # pooled segment buffers never released
            print(f"reconciled batch; parser buffer pool {len(held) * step}MB", flush=True)
        else:
            print("WARN reconciliation worker blocked: heartbeat missed, 0 claims acked", flush=True)
        time.sleep(interval)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-reconciliation
  namespace: healthcare
  labels: { app: claims-reconciliation }
  annotations:
    app.example-health/version: v2.14.0
    app.example-health/change: "x12-claims-parser 4.2.1 -> 5.0.0"
spec:
  replicas: 1
  selector:
    matchLabels: { app: claims-reconciliation }
  template:
    metadata:
      labels: { app: claims-reconciliation, version: v2.14.0 }
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-u", "/app/app.py"]
          env:
            - { name: LEAK_CAP_MB, value: "300" }
          volumeMounts:
            - { name: app, mountPath: /app }
          # No resources block: this is the bug the remediation fixes.
      volumes:
        - name: app
          configMap: { name: claims-reconciliation-app }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-portal
  namespace: healthcare
  labels: { app: patient-portal }
spec:
  replicas: 1
  selector:
    matchLabels: { app: patient-portal }
  template:
    metadata:
      labels: { app: patient-portal }
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling
  namespace: healthcare
  labels: { app: scheduling }
spec:
  replicas: 1
  selector:
    matchLabels: { app: scheduling }
  template:
    metadata:
      labels: { app: scheduling }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
